---
# Compliance: Normalize OpenSCAP XCCDF results to Common Findings Format
#
# This playbook runs on the execution node (localhost) after run_oscap.yml
# has fetched XCCDF result XML files from target hosts.
#
# This is Node 2 of the 2-node assessment workflow:
#   Node 1: run_oscap.yml (targets) → Node 2: normalize.yml (execution node)
#
# The normalize_xccdf module:
#   - Parses each host's XCCDF XML results
#   - Extracts rule metadata (title, description, fix_text, severity, stig_id)
#     directly from the XCCDF datastream — no external rules YAML needed
#   - Strips the XCCDF prefix from rule IDs so they match CaC remediation tags
#   - Produces CFF-compliant findings JSON
#   - Sets compliance_report as an Ansible fact for the backend to consume
#
# Variables:
#   results_dir: directory containing fetched XCCDF XML files
#     (default: /tmp/compliance-results)
#   output_file: path to write the CFF JSON report
#     (default: /tmp/compliance_report.json)

- name: "Compliance: Normalize XCCDF results"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    results_dir: /tmp/compliance-results
    output_file: /tmp/compliance_report.json

  tasks:
    - name: Find all XCCDF result files
      ansible.builtin.find:
        paths: "{{ results_dir }}"
        patterns: "xccdf-results-*.xml"
      register: _result_files

    - name: Fail if no results found
      ansible.builtin.fail:
        msg: >-
          No XCCDF result files found in {{ results_dir }}.
          Ensure run_oscap.yml completed successfully.
      when: _result_files.files | length == 0

    - name: Normalize XCCDF results to Common Findings Format
      security.compliance_rhel9_stig.normalize_xccdf:
        results_files: "{{ _result_files.files | map(attribute='path') | list }}"
        output_file: "{{ output_file }}"
      register: _normalized

    - name: Display summary
      ansible.builtin.debug:
        msg: >-
          Normalized {{ _normalized.hosts_processed }} hosts,
          {{ _normalized.total_findings }} findings
          ({{ _normalized.summary.pass }} pass,
          {{ _normalized.summary.fail }} fail,
          {{ _normalized.summary.error | default(0) }} error,
          {{ _normalized.summary.not_applicable | default(0) }} N/A).
          Output: {{ output_file }}
...
