---
# Compliance: Run OpenSCAP CIS L1 scan on target hosts
#
# This playbook contains 2 plays in a single job template:
#   Play 1 (targets): installs OpenSCAP (if not present), copies the SCAP
#     datastream from the EE, runs the evaluation, fetches results back
#     to the execution node, and cleans up.
#   Play 2 (localhost): normalizes fetched XCCDF XML to CFF JSON.
#
# Both plays run in the same container, so fetched files are available
# to the normalize step without cross-container file sharing.
#
# The datastream file (ssg-rhel9-ds.xml, ~15MB) is copied from the EE
# to the target at scan time and removed afterward. The target host
# does not need scap-security-guide installed.
#
# Variables:
#   oscap_profile: XCCDF profile to evaluate against
#     (default: xccdf_org.ssgproject.content_profile_cis_server_l1)
#     NOTE: This is intentionally named oscap_profile (not compliance_profile)
#     to avoid collision with the backend's compliance_profile extra_var (UUID).
#   ssg_datastream_ee_path: path to datastream inside the EE
#     (default: /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml)
#   target_results_dir: temp directory on targets for scan results
#     (default: /tmp/compliance-scan)
#   fetch_dest_dir: directory on execution node for fetched results
#     (default: /tmp/compliance-results)

- name: "Compliance: OpenSCAP CIS L1 scan"
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true

  vars:
    # The XCCDF profile to evaluate against. This is the oscap profile ID
    # from the datastream, NOT the compliance plugin's compliance profile UUID.
    # The backend sends compliance_profile as an extra_var (compliance profile UUID)
    # which we intentionally ignore here.
    oscap_profile: "{{ oscap_xccdf_profile | default('xccdf_org.ssgproject.content_profile_cis_server_l1') }}"
    ssg_datastream_ee_path: /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
    ssg_datastream_target_path: /tmp/ssg-rhel9-ds.xml
    target_results_dir: /tmp/compliance-scan
    fetch_dest_dir: /tmp/compliance-results

  tasks:
    # -- Install OpenSCAP (if not present) --
    - name: Check if OpenSCAP is installed
      ansible.builtin.command: rpm -q openscap-scanner
      register: _oscap_check
      failed_when: false
      changed_when: false

    - name: Install OpenSCAP scanner
      ansible.builtin.dnf:
        name: openscap-scanner
        state: present
      when: _oscap_check.rc != 0

    - name: Record whether we installed oscap (for cleanup)
      ansible.builtin.set_fact:
        _oscap_was_missing: "{{ _oscap_check.rc != 0 }}"

    # -- Copy datastream from EE to target --
    # The EE has scap-security-guide installed. We copy the datastream
    # XML to the target rather than installing the RPM.
    - name: Copy SCAP datastream to target
      ansible.builtin.copy:
        src: "{{ ssg_datastream_ee_path }}"
        dest: "{{ ssg_datastream_target_path }}"
        mode: '0644'

    # -- Run OpenSCAP evaluation --
    - name: Create results directory
      ansible.builtin.file:
        path: "{{ target_results_dir }}"
        state: directory
        mode: '0755'

    - name: Run OpenSCAP XCCDF evaluation
      ansible.builtin.command:
        cmd: >-
          oscap xccdf eval
          --profile {{ oscap_profile }}
          --results {{ target_results_dir }}/xccdf-results.xml
          {{ ssg_datastream_target_path }}
      register: _scan_result
      # oscap exit codes: 0=all pass, 2=some fail (both valid)
      failed_when: _scan_result.rc not in [0, 2]
      changed_when: false

    # -- Fetch results back to execution node --
    - name: Create local results directory
      ansible.builtin.file:
        path: "{{ fetch_dest_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true
      become: false

    - name: Fetch XCCDF results from target
      ansible.builtin.fetch:
        src: "{{ target_results_dir }}/xccdf-results.xml"
        dest: "{{ fetch_dest_dir }}/xccdf-results-{{ inventory_hostname }}.xml"
        flat: true

    # -- Cleanup on target --
    - name: Remove scan results from target
      ansible.builtin.file:
        path: "{{ target_results_dir }}"
        state: absent

    - name: Remove datastream from target
      ansible.builtin.file:
        path: "{{ ssg_datastream_target_path }}"
        state: absent

    - name: Remove OpenSCAP if we installed it
      ansible.builtin.dnf:
        name: openscap-scanner
        state: absent
      when: _oscap_was_missing | default(false) | bool

    - name: Report scan status
      ansible.builtin.debug:
        msg: >-
          OpenSCAP scan complete on {{ inventory_hostname }}.
          Exit code: {{ _scan_result.rc }}
          (0=all pass, 2=some fail).
          {{ 'OpenSCAP removed (was installed by this scan).' if (_oscap_was_missing | default(false) | bool) else 'OpenSCAP was pre-installed, left in place.' }}

# -- Play 2: Normalize XCCDF results on execution node --
# This play runs in the same job as the scan, so fetched files are
# available on the local filesystem.

- name: "Compliance: Normalize XCCDF results"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    fetch_dest_dir: /tmp/compliance-results
    output_file: /tmp/compliance_report.json

  tasks:
    - name: Find all fetched XCCDF result files
      ansible.builtin.find:
        paths: "{{ fetch_dest_dir }}"
        patterns: "xccdf-results-*.xml"
      register: _result_files

    - name: Fail if no results found
      ansible.builtin.fail:
        msg: >-
          No XCCDF result files found in {{ fetch_dest_dir }}.
          Ensure the scan play completed successfully.
      when: _result_files.files | length == 0

    # Normalize each host's XCCDF results individually. Each loop
    # iteration produces a runner_on_ok event with findings for
    # that host. The backend iterates over ALL events to collect
    # findings from every host. This avoids Controller's event size
    # limit which truncates payloads with 4000+ findings.
    - name: Locate rules metadata file
      ansible.builtin.find:
        paths: "{{ (role_path | default(playbook_dir)) + '/../rules' }}"
        patterns: "*.yml"
      register: _rules_files
      failed_when: false

    - name: Evaluate compliance for each host
      security.compliance_rhel9_cis_l1.normalize_xccdf:
        results_files:
          - "{{ item.path }}"
        output_file: "{{ fetch_dest_dir }}/findings-{{ _host_label }}.json"
        profile_name: "CIS Benchmark RHEL 9 Level 1 - Server"
        framework: "CIS"
        certification_status: "conformant"
        certification_authority: "CIS"
        rules_metadata_file: "{{ (_rules_files.files | default([]) | first | default({})).path | default('') }}"
      vars:
        _host_label: "{{ item.path | basename | regex_replace('xccdf-results-(.+)\\.xml', '\\1') }}"
      loop: "{{ _result_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: _normalized

    # -- Direct POST findings to Backstage plugin API --
    # When backstage_api_url and scan_id are provided (by the plugin
    # backend via extra_vars), POST full findings directly to the
    # /findings/ingest endpoint. This bypasses Controller event storage
    # limits and delivers complete metadata (titles, descriptions,
    # check_text, fix_text, CIS IDs) that would be truncated in events.

    - name: Find per-host findings JSON files
      ansible.builtin.find:
        paths: "{{ fetch_dest_dir }}"
        patterns: "findings-*.json"
      register: _findings_files
      when: backstage_api_url | default('') | length > 0

    - name: POST findings per-host to Backstage compliance API
      ansible.builtin.uri:
        url: "{{ backstage_api_url }}/api/compliance/findings/ingest"
        method: POST
        body_format: json
        body:
          scanId: "{{ scan_id }}"
          ingestToken: "{{ ingest_token | default('') }}"
          findings: "{{ lookup('file', item.path) | from_json | json_query('findings') }}"
        headers:
          Content-Type: application/json
        status_code: [201]
        validate_certs: false
        timeout: 60
      loop: "{{ _findings_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when:
        - backstage_api_url | default('') | length > 0
        - scan_id | default('') | length > 0
      register: _post_results
      failed_when: false

    - name: Report POST results
      ansible.builtin.debug:
        msg: >-
          POSTed findings for {{ _post_results.results | default([]) | selectattr('status', 'defined') | selectattr('status', 'equalto', 201) | list | length }}/{{ _findings_files.files | default([]) | length }} hosts to {{ backstage_api_url }}.
      when: backstage_api_url | default('') | length > 0

    - name: Display summary
      ansible.builtin.debug:
        msg: >-
          Normalized {{ _result_files.files | length }} hosts.
...
