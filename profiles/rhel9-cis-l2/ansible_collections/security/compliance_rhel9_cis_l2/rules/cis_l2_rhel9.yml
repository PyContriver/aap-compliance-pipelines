  - id: directory_permissions_var_log_audit
    title: System Audit Logs Must Have Mode 0750 or Less Permissive
    severity: medium
    cis_id: 6.3.4.1
    cce_id: CCE-83734-4
    description: "Verify the audit log directories have a mode of \"0750\" or less permissive by first determining where the audit logs are stored with the following command: $ sudo grep -iw log_file /etc/audit/auditd.conf log_file = /var/log/audit/audit.log By default, the audit log directory is /var/log/audit.  Configure the audit log directory to be protected from unauthorized read access by setting the correct permissive mode.  The appropriate directory permissions depend on the log_group setting in /etc/audit/"
