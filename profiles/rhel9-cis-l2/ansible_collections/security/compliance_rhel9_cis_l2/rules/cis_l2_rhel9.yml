  - id: dir_perms_world_writable_sticky_bits
    title: Verify that All World-Writable Directories Have Sticky Bits Set
    severity: medium
    cis_id: 7.1.11
    cce_id: CCE-83895-3
    description: "When the so-called 'sticky bit' is set on a directory, only the owner of a given file may remove that file from the directory. Without the sticky bit, any user with write access to a directory may remove any file in the directory. Setting the sticky bit prevents users from removing each other's files. In cases where there is no reason for a directory to be world-writable, a better solution is to remove that permission rather than to set the sticky bit. However, if a directory is used by a partic"
    check_text: "Failing to set the sticky bit on public directories allows unauthorized users to delete files in the directory structure.           The only authorized public directories are those temporary directories supplied with the system, or those designed to be temporary file repositories. The setting is normally reserved for directories used by the system, by users for temporary file storage (such as /tmp), and for directories requiring global read/write access."
    fix_text: "- name: Verify that All World-Writable Directories Have Sticky Bits Set - Define Excluded     (Non-Local) File Systems and Paths   ansible.builtin.set_fact:     excluded_fstypes:     - afs     - autofs     - ceph     - cifs     - smb3     - smbfs     - sshfs     - ncpfs     - ncp     - nfs     - nfs4     - gfs     - gfs2     - glusterfs     - gpfs     - pvfs2     - ocfs2     - lustre     - davfs     - fuse.sshfs     excluded_paths:     - dev     - proc     - run     - sys     search_paths: []   "
