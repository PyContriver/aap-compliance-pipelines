  - id: partition_for_dev_shm
    title: Ensure /dev/shm is configured
    severity: low
    cis_id: 1.1.2.2.1
    cce_id: CCE-86283-9
    description: "The /dev/shm is a traditional shared memory concept. One program will create a memory portion, which other processes (if permitted) can access. If /dev/shm is not configured, tmpfs will be mounted to /dev/shm by systemd."
    check_text: "Any user can upload and execute files inside the /dev/shm similar to the /tmp partition. Configuring /dev/shm allows an administrator to set the noexec option on the mount, making /dev/shm useless for an attacker to install executable code. It would also prevent an attacker from establishing a hardlink to a system setuid program and wait for it to be updated. Once the program was updated, the hardlink would be broken and the attacker would have his own copy of the program. If the program happene"
    fix_text: ""
  - id: partition_for_home
    title: Ensure /home Located On Separate Partition
    severity: low
    cis_id: 1.1.2.3.1
    cce_id: CCE-83468-9
    description: "If user home directories will be stored locally, create a separate partition for /home at installation time (or migrate it later using LVM). If /home will be mounted from another system such as an NFS server, then creating a separate partition is not necessary at installation time, and the mountpoint can instead be configured later."
    check_text: "Ensuring that /home is mounted on its own partition enables the setting of more restrictive mount options, and also helps ensure that users cannot trivially fill partitions used for log or audit data storage."
    fix_text: "[[customizations.filesystem]] mountpoint = \"/home\" size = 1073741824"
  - id: partition_for_tmp
    title: Ensure /tmp Located On Separate Partition
    severity: low
    cis_id: 1.1.2.1.1
    cce_id: CCE-90845-9
    description: "The /tmp directory is a world-writable directory used for temporary file storage. Ensure it has its own partition or logical volume at installation time, or migrate it using LVM."
    check_text: "The /tmp partition is used as temporary storage by many programs. Placing /tmp in its own partition enables the setting of more restrictive mount options, which can help protect programs which use it."
    fix_text: "[[customizations.filesystem]] mountpoint = \"/tmp\" size = 1073741824"
  - id: partition_for_var
    title: Ensure /var Located On Separate Partition
    severity: low
    cis_id: 1.1.2.4.1
    cce_id: CCE-83466-3
    description: "The /var directory is used by daemons and other system services to store frequently-changing data. Ensure that /var has its own partition or logical volume at installation time, or migrate it using LVM."
    check_text: "Ensuring that /var is mounted on its own partition enables the setting of more restrictive mount options. This helps protect system services such as daemons or other programs which use it. It is not uncommon for the /var directory to contain world-writable directories installed by other software packages."
    fix_text: "[[customizations.filesystem]] mountpoint = \"/var\" size = 3221225472"
  - id: partition_for_var_log
    title: Ensure /var/log Located On Separate Partition
    severity: low
    cis_id: 1.1.2.6.1
    cce_id: CCE-90848-3
    description: "System logs are stored in the /var/log directory.  Ensure that /var/log has its own partition or logical volume at installation time, or migrate it using LVM."
    check_text: "Placing /var/log in its own partition enables better separation between log files and other files in /var/."
    fix_text: "[[customizations.filesystem]] mountpoint = \"/var/log\" size = 1073741824"
  - id: partition_for_var_log_audit
    title: Ensure /var/log/audit Located On Separate Partition
    severity: low
    cis_id: 1.1.2.7.1
    cce_id: CCE-90847-5
    description: "Audit logs are stored in the /var/log/audit directory.  Ensure that /var/log/audit has its own partition or logical volume at installation time, or migrate it using LVM. Make absolutely certain that it is large enough to store all audit logs that will be created by the auditing daemon."
