    cce_id: CCE-86457-9
    description: "The Red Hat Enterprise Linux 9 operating system audit tools must have the proper ownership configured to protected against unauthorized access.  Verify it by running the following command: $ stat -c \"%n %G\" /sbin/auditctl /sbin/aureport /sbin/ausearch /sbin/autrace /sbin/auditd /sbin/augenrules /sbin/audisp-syslog  /sbin/auditctl root  /sbin/aureport root  /sbin/ausearch root  /sbin/autrace root  /sbin/auditd root  /sbin/augenrules root  /sbin/audisp-syslog root    Audit tools needed to successf"
    check_text: "Protecting audit information also includes identifying and protecting the tools used to view and manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized operation on audit information.  Operating systems providing tools to interface with audit information will leverage user permissions and roles identifying the user accessing the tools and the corresponding rights the user enjoys to make access decisions regarding the access to audit tools."
