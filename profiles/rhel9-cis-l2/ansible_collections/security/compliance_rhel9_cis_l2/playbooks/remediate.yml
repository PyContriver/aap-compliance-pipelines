---
# Compliance: Apply CaC CIS Level 2 remediation
#
# This playbook imports the ComplianceAsCode (CaC) remediation playbook
# from the scap-security-guide RPM inside the Execution Environment.
#
# IMPORTANT: This playbook is launched DIRECTLY as a standalone job
# template — NOT as part of the assessment workflow. The compliance
# dashboard resolves the remediate JT from the workflow template and
# launches it directly with native AAP job_tags to scope remediation
# to selected rules.
#
# The assessment workflow (gather → evaluate) does NOT include a
# remediate node. This separation ensures assessment scans never
# apply changes to hosts, and remediation is always a deliberate,
# user-initiated action.
#
# Scoping:
#   The JT has ask_tags_on_launch: true. The dashboard passes selected
#   rule IDs as job_tags. AAP's built-in --tags filtering applies
#   automatically to the CaC playbook's per-rule tagged tasks.
#
# Parameter overrides:
#   CaC variables (e.g., var_accounts_tmout: 900) are passed as
#   extra_vars through the JT's ask_variables_on_launch setting.
#
# Content lifecycle:
#   The CaC playbook is maintained by Red Hat as part of scap-security-guide.
#   CIS benchmark updates → Red Hat RPM update → rebuild EE → new content.

- name: "Compliance: Apply CaC CIS L2 remediation"
  ansible.builtin.import_playbook: /usr/share/scap-security-guide/ansible/rhel9-playbook-cis.yml
