---
# Register DISA STIG RHEL 9 compliance profile on AAP Controller
#
# Usage:
#   ansible-playbook install.yml -e aap_host=https://controller.example.com -e aap_token=<token>
#
# This playbook creates the necessary Controller resources for the STIG profile:
#   - Project (syncs this collection from Git)
#   - Assessment Job Template (run_oscap.yml)
#   - Remediation Job Template (remediate.yml)
#
# Prerequisites:
#   - Execution Environment with scap-security-guide + openscap-scanner
#   - Target inventory with RHEL 9 hosts
#   - Machine credential with SSH access to targets

- name: "Install: DISA STIG RHEL 9 Compliance Profile"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_host: "{{ lookup('env', 'AAP_HOST') }}"
    aap_token: "{{ lookup('env', 'AAP_API_TOKEN') }}"
    org_name: "{{ organization | default('Default') }}"
    project_name: "{{ project | default('compliance-profile-stig-rhel9') }}"
    ee_name: "{{ execution_environment | default('compliance-stig-rhel9') }}"
    inventory_name: "{{ inventory | default('compliance-rhel9-inventory') }}"

    profile:
      name: "DISA STIG RHEL 9"
      framework: "DISA_STIG"
      version: "V2R8"
      certification_status: "certified"
      certification_authority: "NIST SCAP 1.2"
      scan_jt_name: "compliance-scan-stig-rhel9"
      scan_playbook: "profiles/rhel9-stig/ansible_collections/security/compliance_rhel9_stig/playbooks/run_oscap.yml"
      remediate_jt_name: "compliance-remediate-stig-rhel9"
      remediate_playbook: "profiles/rhel9-stig/ansible_collections/security/compliance_rhel9_stig/playbooks/remediate.yml"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - aap_host | length > 0
          - aap_token | length > 0
        fail_msg: "Set AAP_HOST and AAP_API_TOKEN environment variables or pass -e aap_host=... -e aap_token=..."

    - name: Create assessment job template
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ profile.scan_jt_name }}"
          organization: "{{ org_name }}"
          project: "{{ project_name }}"
          playbook: "{{ profile.scan_playbook }}"
          inventory: "{{ inventory_name }}"
          ask_variables_on_launch: true
          use_fact_cache: true
        validate_certs: false
        status_code: [200, 201]
      register: _scan_jt
      failed_when: false

    - name: Create remediation job template
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ profile.remediate_jt_name }}"
          organization: "{{ org_name }}"
          project: "{{ project_name }}"
          playbook: "{{ profile.remediate_playbook }}"
          inventory: "{{ inventory_name }}"
          ask_variables_on_launch: true
          ask_tags_on_launch: true
        validate_certs: false
        status_code: [200, 201]
      register: _remediate_jt
      failed_when: false

    - name: Report installation result
      ansible.builtin.debug:
        msg: |
          === {{ profile.name }} Profile Installed ===
          Assessment JT: {{ profile.scan_jt_name }} (id={{ _scan_jt.json.id | default('exists') }})
          Remediation JT: {{ profile.remediate_jt_name }} (id={{ _remediate_jt.json.id | default('exists') }})
          Framework: {{ profile.framework }}
          Version: {{ profile.version }}
