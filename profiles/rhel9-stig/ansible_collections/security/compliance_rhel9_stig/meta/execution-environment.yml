---
# Execution Environment Profile: DISA STIG for RHEL 9
# Used by the AAP EE Builder (or Portal EE Build Experience) to construct
# a compliance-ready EE.
#
# This EE includes:
#   openscap-scanner — the oscap binary used by run_oscap.yml to evaluate
#     targets. The binary is also copied to targets at scan time if not
#     pre-installed (install, scan, remove pattern).
#   scap-security-guide — provides:
#     - SCAP data streams for OpenSCAP (/usr/share/xml/scap/ssg/content/)
#       The datastream (ssg-rhel9-ds.xml) is copied from the EE to targets
#       at scan time. Targets do NOT need this RPM installed.
#     - Pre-rendered Ansible remediation playbooks
#       (/usr/share/scap-security-guide/ansible/rhel9-playbook-stig.yml)
#     - XCCDF/OVAL content for 366 STIG V2R8 rules
#
# Content lifecycle:
#   DISA quarterly updates -> Red Hat RPM update -> rebuild EE -> new content.
#   No plugin redeploy needed — content is self-contained in the EE.
#
# Build locally:
#   cd ansible_collections/security/compliance_rhel9_stig
#   ansible-builder build -f meta/execution-environment.yml -t compliance-stig-rhel9:latest -v3
#
# Build via Portal EE Build Experience:
#   Upload this file as the EE definition in the Portal UI.
#   The Portal will build and register the EE automatically.

version: 3

build_arg_defaults:
  ANSIBLE_GALAXY_CLI_COLLECTION_OPTS: '--pre'

options:
  package_manager_path: /usr/bin/microdnf

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

dependencies:
  galaxy:
    collections:
      - name: ansible.posix
      - name: community.general

additional_build_steps:
  prepend_galaxy:
    - COPY _build/collections/ /usr/share/ansible/collections/
  prepend_final:
    - RUN printf '[centos9-appstream]\nname=CentOS 9 AppStream\nbaseurl=https://mirror.stream.centos.org/9-stream/AppStream/$basearch/os/\ngpgcheck=0\nenabled=1\n' > /etc/yum.repos.d/centos9.repo && microdnf install -y scap-security-guide openscap-scanner && microdnf clean all && rm /etc/yum.repos.d/centos9.repo
  append_final:
    - RUN rpm -q scap-security-guide openscap-scanner
    - RUN test -f /usr/share/scap-security-guide/ansible/rhel9-playbook-stig.yml
    - RUN test -f /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
