---
# Compliance Profile Metadata
#
# This file declares the profile's identity, capabilities, and display
# configuration. It is read by the Backstage compliance plugin to:
#   1. Auto-populate profile registration fields when a user selects a scan JT
#   2. Render the dashboard dynamically (columns, labels, gauge text, tabs)
#
# These values are also set as JT default extra_vars during
# profile installation (install.yml).

profile:
  slug: "rhel9-stig"
  name: "DISA STIG RHEL 9"
  framework: "DISA_STIG"
  version: "V2R8"
  platform: "RHEL 9"
  scanner: "openscap"
  oscap_xccdf_profile: "xccdf_org.ssgproject.content_profile_stig"
  remediation_playbook: "playbooks/remediate.yml"
  remediate_jt_name: "compliance-remediate-stig-rhel9"
  certification:
    status: "certified"
    authority: "NIST SCAP 1.2"
    disclaimer: >
      OpenSCAP is NIST SCAP 1.2 validated. SCAP Security Guide content
      is produced in collaboration with DISA FSO. Scan results are
      accepted for DISA STIG compliance assessments.
  platform_spec:
    os_family: ["RedHat"]
    os_version: ["9"]

  display:
    gauge_label: "compliance rate"
    gauge_unit: "rules"
    remediation_verb: "Remediate"
    severity_map:
      CAT_I: "CAT I (High)"
      CAT_II: "CAT II (Medium)"
      CAT_III: "CAT III (Low)"
    columns:
      - field: rule_id
        label: "Rule ID"
      - field: stig_id
        label: "STIG ID"
      - field: title
        label: "Title"
      - field: severity
        label: "Severity"
      - field: status
        label: "Status"
      - field: check_text
        label: "Check"
      - field: fix_text
        label: "Fix"
