  - id: audit_rules_dac_modification_chmod
    title: Record Events that Modify the System's Discretionary Access Controls - chmod
    severity: medium
    cis_id: 6.3.3.9
    cce_id: CCE-83830-0
    description: "At a minimum, the audit system should collect file permission changes for all users and root. If the auditd daemon is configured to use the augenrules program to read audit rules during daemon startup (the default), add the following line to a file with suffix .rules in the directory /etc/audit/rules.d: -a always,exit -F arch=b32 -S chmod -F auid>=1000 -F auid!=unset -F key=perm_mod If the system is 64 bit then also add the following line: -a always,exit -F arch=b64 -S chmod -F auid>=1000 -F aui"
    check_text: "The changing of file permissions could indicate that a user is attempting to gain access to information that would otherwise be disallowed. Auditing DAC modifications can facilitate the identification of patterns of abuse among both authorized and unauthorized users."
    fix_text: "- name: Gather the package facts   package_facts:     manager: auto   tags:   - CCE-83830-0   - CJIS-5.4.1.1   - DISA-STIG-RHEL-09-654015   - NIST-800-171-3.1.7   - NIST-800-53-AU-12(c)   - NIST-800-53-AU-2(d)   - NIST-800-53-CM-6(a)   - PCI-DSS-Req-10.5.5   - PCI-DSSv4-10.3   - PCI-DSSv4-10.3.4   - audit_rules_dac_modification_chmod   - low_complexity   - low_disruption   - medium_severity   - reboot_required   - restrict_strategy  - name: Set architecture for audit chmod tasks   ansible.builti"
