  - id: dir_perms_world_writable_sticky_bits
    title: Verify that All World-Writable Directories Have Sticky Bits Set
    severity: medium
    cis_id: 7.1.11
    cce_id: CCE-83895-3
    description: "When the so-called 'sticky bit' is set on a directory, only the owner of a given file may remove that file from the directory. Without the sticky bit, any user with write access to a directory may remove any file in the directory. Setting the sticky bit prevents users from removing each other's files. In cases where there is no reason for a directory to be world-writable, a better solution is to remove that permission rather than to set the sticky bit. However, if a directory is used by a partic"
    check_text: "Failing to set the sticky bit on public directories allows unauthorized users to delete files in the directory structure.           The only authorized public directories are those temporary directories supplied with the system, or those designed to be temporary file repositories. The setting is normally reserved for directories used by the system, by users for temporary file storage (such as /tmp), and for directories requiring global read/write access."
    fix_text: "- name: Verify that All World-Writable Directories Have Sticky Bits Set - Define Excluded     (Non-Local) File Systems and Paths   ansible.builtin.set_fact:     excluded_fstypes:     - afs     - autofs     - ceph     - cifs     - smb3     - smbfs     - sshfs     - ncpfs     - ncp     - nfs     - nfs4     - gfs     - gfs2     - glusterfs     - gpfs     - pvfs2     - ocfs2     - lustre     - davfs     - fuse.sshfs     excluded_paths:     - dev     - proc     - run     - sys     search_paths: []   "
  - id: dir_perms_world_writable_system_owned
    title: Ensure All World-Writable Directories Are Owned by a System Account
    severity: medium
    cis_id: 5
    cce_id: CCE-86469-4
    description: "All directories in local partitions which are world-writable should be owned by root or another system account. If any world-writable directories are not owned by a system account, this should be investigated. Following this, the files should be deleted or assigned to an appropriate owner."
    check_text: "Allowing a user account to own a world-writable directory is undesirable because it allows the owner of that directory to remove or replace any files that may be placed in the directory by other users."
    fix_text: ""
  - id: file_permissions_ungroupowned
    title: Ensure All Files Are Owned by a Group
    severity: medium
    cis_id: 7.1.12
    cce_id: CCE-83906-8
    description: "If any file is not group-owned by a valid defined group, the cause of the lack of group-ownership must be investigated. Following this, those files should be deleted or assigned to an appropriate group. The groups need to be defined in /etc/group or in /usr/lib/group if nss-altfiles are configured to be used in /etc/nsswitch.conf.  Locate the mount points related to local devices by the following command: $ findmnt -n -l -k -it $(awk '/nodev/ { print $2 }' /proc/filesystems | paste -sd,)  For al"
    check_text: "Unowned files do not directly imply a security problem, but they are generally a sign that something is amiss. They may be caused by an intruder, by incorrect software installation or draft software removal, or by failure to remove all files belonging to a deleted account, or other similar cases. The files should be repaired so they will not cause problems when accounts are created in the future, and the cause should be discovered and addressed."
    fix_text: ""
  - id: no_files_unowned_by_user
    title: Ensure All Files Are Owned by a User
    severity: medium
