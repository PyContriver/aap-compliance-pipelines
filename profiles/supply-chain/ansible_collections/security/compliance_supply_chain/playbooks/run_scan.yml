---
# Supply Chain: SBOM collection on targets, vulnerability matching on execution node
#
# This playbook contains 2 plays in a single job template (ADR-003 pattern):
#   Play 1 (targets): copies Syft from the EE, generates a CycloneDX SBOM,
#     fetches the SBOM JSON back to the execution node, and cleans up.
#     Targets do NOT need internet access or Grype.
#   Play 2 (localhost): runs Grype against each fetched SBOM (using the
#     EE's cached vulnerability database), normalizes to CFF, POSTs to
#     the Backstage compliance API.
#
# This architecture separates data collection (targets) from intelligence
# (execution node). Grype's CVE database is maintained in the EE, not on
# every target — reducing network traffic by ~71% and eliminating the
# need for internet on managed hosts. When TPA/TSSC replaces Grype,
# only Play 2 changes.
#
# Variables:
#   syft_scope: Syft scan scope (default: squashed — faster, fewer layers)
#   scan_paths: Specific paths to scan (default: / — full filesystem)
#   target_results_dir: temp directory on targets for scan results
#   fetch_dest_dir: directory on execution node for fetched results

- name: "Supply Chain: Collect SBOMs from targets"
  hosts: "{{ target_hosts | default('all') }}"
  become: true
  gather_facts: true
  max_fail_percentage: 100

  vars:
    syft_scope: "{{ scan_scope | default('squashed') }}"
    scan_target: "{{ scan_paths | default('/') }}"
    target_results_dir: /tmp/supply-chain-scan
    fetch_dest_dir: /tmp/supply-chain-results

  tasks:
    - name: Check if Syft is available on target
      ansible.builtin.command: which syft
      register: _syft_check
      failed_when: false
      changed_when: false

    - name: Copy Syft binary from EE if not on target
      ansible.builtin.copy:
        src: /usr/local/bin/syft
        dest: /tmp/syft
        mode: '0755'
      when: _syft_check.rc != 0

    - name: Set scanner path
      ansible.builtin.set_fact:
        _syft_bin: "{{ '/tmp/syft' if _syft_check.rc != 0 else 'syft' }}"
        _syft_copied: "{{ _syft_check.rc != 0 }}"

    - name: Create results directory
      ansible.builtin.file:
        path: "{{ target_results_dir }}"
        state: directory
        mode: '0755'

    - name: Generate SBOM with Syft
      ansible.builtin.command:
        cmd: >-
          {{ _syft_bin }} {{ scan_target }} --scope {{ syft_scope }}
          -o cyclonedx-json
          --file {{ target_results_dir }}/sbom.json
      register: _syft_result
      changed_when: false
      timeout: 900

    - name: Create local results directory
      ansible.builtin.file:
        path: "{{ fetch_dest_dir }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      run_once: true
      become: false

    - name: Fetch SBOM from target
      ansible.builtin.fetch:
        src: "{{ target_results_dir }}/sbom.json"
        dest: "{{ fetch_dest_dir }}/sbom-{{ inventory_hostname }}.json"
        flat: true

    - name: Remove scan artifacts from target
      ansible.builtin.file:
        path: "{{ target_results_dir }}"
        state: absent

    - name: Remove Syft binary if we copied it
      ansible.builtin.file:
        path: /tmp/syft
        state: absent
      when: _syft_copied | default(false) | bool

    - name: Report SBOM collection status
      ansible.builtin.debug:
        msg: >-
          SBOM collected from {{ inventory_hostname }}.
          Syft exit: {{ _syft_result.rc }}.

# ── Play 2: Vulnerability matching + normalization on execution node ──

- name: "Supply Chain: Match vulnerabilities and normalize"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    fetch_dest_dir: /tmp/supply-chain-results
    grype_results_dir: /tmp/supply-chain-grype

  tasks:
    - name: Find all fetched SBOM files
      ansible.builtin.find:
        paths: "{{ fetch_dest_dir }}"
        patterns: "sbom-*.json"
      register: _sbom_files

    - name: Fail if no SBOMs found
      ansible.builtin.fail:
        msg: >-
          No SBOM files found in {{ fetch_dest_dir }}.
          Ensure the SBOM collection play completed successfully.
      when: _sbom_files.files | length == 0

    - name: Create Grype results directory
      ansible.builtin.file:
        path: "{{ grype_results_dir }}"
        state: directory
        mode: '0755'

    - name: Run Grype against each SBOM
      ansible.builtin.command:
        cmd: >-
          grype sbom:{{ item.path }}
          -o json
          --file {{ grype_results_dir }}/grype-{{ _hostname }}.json
      vars:
        _hostname: "{{ item.path | basename | regex_replace('sbom-(.+)\\.json', '\\1') }}"
      loop: "{{ _sbom_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: _grype_results
      changed_when: false
      failed_when: false
      timeout: 300

    - name: Find all Grype result files
      ansible.builtin.find:
        paths: "{{ grype_results_dir }}"
        patterns: "grype-*.json"
      register: _grype_result_files

    - name: Fail if no Grype results found
      ansible.builtin.fail:
        msg: >-
          No Grype result files found in {{ grype_results_dir }}.
          Ensure the Grype scan completed successfully.
      when: _grype_result_files.files | length == 0

    # Normalize each host's Grype results individually. Each loop
    # iteration produces a runner_on_ok event with that host's findings.
    # This avoids loading all hosts' results into memory at once (which
    # caused OOM on the execution node with 15+ hosts) and stays under
    # Controller's event size limit for large finding counts.
    - name: Normalize Grype results to CFF (per-host)
      security.compliance_supply_chain.normalize_cyclonedx:
        grype_files:
          - "{{ item.path }}"
        output_file: "{{ grype_results_dir }}/findings-{{ _hostname }}.json"
        profile_name: "{{ profile_name | default('Supply Chain Vulnerability Scan') }}"
        framework: "{{ framework | default('SUPPLY_CHAIN') }}"
      vars:
        _hostname: "{{ item.path | basename | regex_replace('grype-(.+)\\.json', '\\1') }}"
      loop: "{{ _grype_result_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: _normalized

    # ── Direct POST findings to Backstage plugin API ─────────────────
    # Collect per-host findings files and POST as a single batch.

    - name: Find per-host findings JSON files
      ansible.builtin.find:
        paths: "{{ grype_results_dir }}"
        patterns: "findings-*.json"
      register: _findings_files
      when: backstage_api_url | default('') | length > 0

    - name: Read per-host findings files
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ _findings_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path | basename }}"
      register: _findings_raw
      when: backstage_api_url | default('') | length > 0

    - name: Build combined findings array
      ansible.builtin.set_fact:
        _all_findings: "{{ _findings_raw.results | default([]) | selectattr('content', 'defined') | map(attribute='content') | map('b64decode') | map('from_json') | map(attribute='findings', default=[]) | flatten }}"
      when: backstage_api_url | default('') | length > 0

    - name: POST findings to Backstage compliance API
      ansible.builtin.uri:
        url: "{{ backstage_api_url }}/api/compliance/findings/ingest"
        method: POST
        body_format: json
        body:
          scanId: "{{ scan_id }}"
          ingestToken: "{{ ingest_token | default('') }}"
          findings: "{{ _all_findings }}"
        headers:
          Content-Type: application/json
        status_code: [201]
        validate_certs: false
        # Higher than STIG's 60s — supply chain can have 500+ CVEs per host
        timeout: 120
      when:
        - backstage_api_url | default('') | length > 0
        - scan_id | default('') | length > 0
        - _all_findings | default([]) | length > 0
      register: _post_result
      failed_when: false

    - name: Report POST result
      ansible.builtin.debug:
        msg: >-
          {{ 'POSTed ' + (_post_result.json.findingsCount | default('?') | string) + ' findings to ' + backstage_api_url
             if (_post_result.status | default(0)) == 201
             else 'Direct POST skipped or failed (status=' + (_post_result.status | default('N/A') | string) + ').' }}
      when: backstage_api_url | default('') | length > 0

    - name: Display summary
      ansible.builtin.debug:
        msg: >-
          Supply chain scan complete.
          Hosts: {{ _normalized.results | selectattr('hosts_processed', 'defined') | map(attribute='hosts_processed') | sum }},
          Findings: {{ _normalized.results | selectattr('total_findings', 'defined') | map(attribute='total_findings') | sum }}
          across {{ _grype_result_files.files | length }} hosts.
