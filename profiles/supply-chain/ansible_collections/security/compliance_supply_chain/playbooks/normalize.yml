---
# Supply Chain: Standalone normalization utility
#
# Normalizes Grype JSON results to CFF without scanning.
# Useful for debugging, reprocessing, and Tier 2 adapter reuse.
#
# Usage:
#   ansible-playbook normalize.yml \
#     -e grype_results_dir=/tmp/grype-results \
#     -e output_file=/tmp/supply-chain-report.json

- name: "Supply Chain: Normalize Grype results (standalone)"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    grype_results_dir: /tmp/supply-chain-results
    output_file: /tmp/supply-chain-report.json

  tasks:
    - name: Find Grype result files
      ansible.builtin.find:
        paths: "{{ grype_results_dir }}"
        patterns: "grype-*.json"
      register: _result_files

    - name: Fail if no results found
      ansible.builtin.fail:
        msg: "No Grype result files found in {{ grype_results_dir }}"
      when: _result_files.files | length == 0

    - name: Normalize Grype results to CFF
      security.compliance_supply_chain.normalize_cyclonedx:
        grype_files: "{{ _result_files.files | map(attribute='path') | list }}"
        output_file: "{{ output_file }}"
        profile_name: "{{ profile_name | default('Supply Chain Vulnerability Scan') }}"
        framework: "{{ framework | default('SUPPLY_CHAIN') }}"
      register: _normalized

    - name: Display summary
      ansible.builtin.debug:
        msg: >-
          Normalized {{ _normalized.hosts_processed }} hosts.
          Packages: {{ _normalized.total_packages }},
          CVEs: {{ _normalized.total_vulnerabilities }},
          Findings: {{ _normalized.total_findings }}.
          Output: {{ output_file }}
