---
# Compliance Profile Metadata — Supply Chain Vulnerability Scanning
#
# This profile uses Syft (SBOM generation) and Grype (vulnerability matching)
# to scan managed hosts for known CVEs in OS packages and language-level
# dependencies. Findings are normalized to CFF via CycloneDX mapping.

profile:
  slug: "supply-chain"
  name: "Supply Chain Vulnerability Scan"
  framework: "SUPPLY_CHAIN"
  version: "1.0.0"
  platform: "Linux (multi-distro)"
  scanner: "syft-grype"
  remediation_playbook: "playbooks/remediate.yml"
  remediate_jt_name: "compliance-remediate-supply-chain"
  certification:
    status: "uncertified"
    authority: "N/A"
    disclaimer: >
      Syft and Grype are open-source tools from Anchore. Vulnerability data
      is sourced from NVD and distribution-specific advisory feeds. Results
      should be validated against vendor security advisories.
  platform_spec:
    os_family: ["RedHat", "Debian", "Suse", "Alpine"]

  display:
    gauge_label: "vulnerability-free rate"
    gauge_unit: "packages"
    score_formula: "vulnerability_free_rate"
    remediation_verb: "Patch"
    severity_map:
      CAT_I: "Critical / High"
      CAT_II: "Medium"
      CAT_III: "Low"
    columns:
      - field: rule_id
        label: "CVE"
      - field: title
        label: "Package"
      - field: severity
        label: "CVSS Severity"
      - field: status
        label: "Status"
      - field: fix_text
        label: "Remediation"
      - field: evidence.cvss_score
        label: "Score"
    export_formats:
      - key: csv
        label: "Export as CSV"
        type: cff_derived
      - key: json
        label: "Export as JSON"
        type: cff_derived
      - key: sbom-cyclonedx
        label: "Export SBOMs (CycloneDX)"
        description: "Original SBOM files per host in CycloneDX JSON format"
        type: artifact
        artifact_key: "sbom-*"
        mime_type: "application/vnd.cyclonedx+json"
        file_extension: ".cdx.json"
    tab:
      label: "Supply Chain"
      icon: "security"
      layout:
        - widget: score_grid
          title: "Vulnerability Overview"
        - widget: action_table
          title: "Remediation Actions"
          fixable_label: "Fix Available"
          unfixable_label: "No Fix / Monitor"
        - widget: host_risk_heatmap
          title: "Host Risk"
          labels:
            findings: "Vulnerabilities"
            critical: "Critical / High"
            medium: "Medium"
            low: "Low"
            clean: "Clean"
