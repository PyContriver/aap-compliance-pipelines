---
# Register Supply Chain Vulnerability Scan compliance profile on AAP Controller
#
# Usage:
#   ansible-playbook install.yml -e aap_host=https://controller.example.com -e aap_token=<token>
#
# This playbook creates the necessary Controller resources:
#   - Assessment Job Template (run_scan.yml — Syft + Grype on targets)
#   - Remediation Job Template (remediate.yml — dnf/apt update)
#
# If a profile with framework=SUPPLY_CHAIN already exists in the compliance
# backend, this playbook reconnects it (preserving all historical data).
#
# Prerequisites:
#   - Execution Environment with Syft + Grype
#   - Target inventory with supported Linux hosts
#   - Machine credential with SSH access to targets

- name: "Install: Supply Chain Vulnerability Scan Profile"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    aap_host: "{{ lookup('env', 'AAP_HOST') }}"
    aap_token: "{{ lookup('env', 'AAP_API_TOKEN') }}"
    backstage_api_url: "{{ lookup('env', 'BACKSTAGE_API_URL') | default('', true) }}"
    backstage_token: "{{ lookup('env', 'BACKSTAGE_TOKEN') | default('', true) }}"
    org_name: "{{ organization | default('Default') }}"
    project_name: "{{ project | default('compliance-profile-supply-chain') }}"
    ee_name: "{{ execution_environment | default('compliance-supply-chain') }}"
    inventory_name: "{{ inventory | default('compliance-rhel9-inventory') }}"

    profile:
      slug: "supply-chain"
      name: "Supply Chain Vulnerability Scan"
      framework: "SUPPLY_CHAIN"
      version: "1.0.0"
      description: "Syft/Grype SBOM vulnerability scanning for OS packages and language dependencies across Linux hosts."
      certification_status: "uncertified"
      certification_authority: "N/A"
      certification_disclaimer: "Syft and Grype are open-source tools from Anchore. Vulnerability data is sourced from NVD and distribution-specific advisory feeds."
      platform: "Linux (multi-distro)"
      scanner: "syft-grype"
      os_family: ["RedHat", "Debian", "Suse", "Alpine"]
      scan_jt_name: "compliance-scan-supply-chain"
      scan_playbook: "profiles/supply-chain/ansible_collections/security/compliance_supply_chain/playbooks/run_scan.yml"
      remediate_jt_name: "compliance-remediate-supply-chain"
      remediate_playbook: "profiles/supply-chain/ansible_collections/security/compliance_supply_chain/playbooks/remediate.yml"
      display_config:
        gauge_label: "vulnerability-free rate"
        gauge_unit: "packages"
        remediation_verb: "Patch"
        severity_map:
          CAT_I: "Critical / High"
          CAT_II: "Medium"
          CAT_III: "Low"
        columns:
          - { field: "rule_id", label: "CVE" }
          - { field: "title", label: "Package" }
          - { field: "severity", label: "CVSS Severity" }
          - { field: "status", label: "Status" }
          - { field: "fix_text", label: "Remediation" }
        export_formats:
          - { key: "csv", label: "Export as CSV", type: "cff_derived" }
          - { key: "json", label: "Export as JSON", type: "cff_derived" }
          - { key: "sbom-cyclonedx", label: "Export SBOMs (CycloneDX)", description: "Original SBOM files per host in CycloneDX JSON format", type: "artifact", artifact_key: "sbom-*", mime_type: "application/vnd.cyclonedx+json", file_extension: ".cdx.json" }
        score_formula: "vulnerability_free_rate"
        tab:
          label: "Supply Chain"
          icon: "security"
          layout:
            - { widget: "score_grid", title: "Vulnerability Overview" }
            - { widget: "action_table", title: "Remediation Actions", fixable_label: "Fix Available", unfixable_label: "No Fix / Monitor" }
            - { widget: "host_risk_heatmap", title: "Host Risk", actions: [{ type: "download_artifact", artifact_key_prefix: "sbom-", label: "SBOM", file_extension: ".cdx.json" }] }

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - aap_host | length > 0
          - aap_token | length > 0
        fail_msg: "Set AAP_HOST and AAP_API_TOKEN environment variables or pass -e aap_host=... -e aap_token=..."

    - name: Create assessment job template
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ profile.scan_jt_name }}"
          organization: "{{ org_name }}"
          project: "{{ project_name }}"
          playbook: "{{ profile.scan_playbook }}"
          inventory: "{{ inventory_name }}"
          become_enabled: true
          ask_variables_on_launch: true
          ask_inventory_on_launch: true
          use_fact_cache: true
          extra_vars: "{{ {'profile_slug': profile.slug, 'profile_name': profile.name, 'framework': profile.framework, 'version': profile.version, 'description': profile.description, 'certification_status': profile.certification_status, 'certification_authority': profile.certification_authority, 'certification_disclaimer': profile.certification_disclaimer, 'remediate_jt_name': profile.remediate_jt_name, 'remediation_playbook': profile.remediate_playbook, 'platform': profile.platform, 'scanner': profile.scanner, 'os_family': profile.os_family, 'display_config': profile.display_config} | to_json }}"
        validate_certs: false
        status_code: [200, 201]
      register: _scan_jt
      failed_when: false

    - name: Create remediation job template
      ansible.builtin.uri:
        url: "{{ aap_host }}/api/controller/v2/job_templates/"
        method: POST
        headers:
          Authorization: "Bearer {{ aap_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          name: "{{ profile.remediate_jt_name }}"
          organization: "{{ org_name }}"
          project: "{{ project_name }}"
          playbook: "{{ profile.remediate_playbook }}"
          inventory: "{{ inventory_name }}"
          become_enabled: true
          ask_variables_on_launch: true
          ask_inventory_on_launch: true
          ask_limit_on_launch: true
        validate_certs: false
        status_code: [200, 201]
      register: _remediate_jt
      failed_when: false

    # NOTE: The /profiles/connect endpoint is forward-looking — the backend
    # does not implement it yet. This task will silently skip (failed_when: false)
    # until the lifecycle management endpoints are built (L6 build plan phase).
    - name: Reconnect profile in compliance backend (if available)
      when: backstage_api_url | length > 0
      ansible.builtin.uri:
        url: "{{ backstage_api_url }}/api/compliance/profiles/connect"
        method: POST
        headers:
          Authorization: "Bearer {{ backstage_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          framework: "{{ profile.framework }}"
          version: "{{ profile.version }}"
          displayName: "{{ profile.name }}"
        validate_certs: false
        status_code: [200, 201]
      register: _backend_connect
      failed_when: false

    - name: Report installation result
      ansible.builtin.debug:
        msg: |
          === {{ profile.name }} Profile Installed ===
          Assessment JT: {{ profile.scan_jt_name }} (id={{ _scan_jt.json.id | default('exists') }})
          Remediation JT: {{ profile.remediate_jt_name }} (id={{ _remediate_jt.json.id | default('exists') }})
          Framework: {{ profile.framework }}
          Version: {{ profile.version }}
          Backend: {{ 'reconnected' if (_backend_connect.status | default(0)) in [200, 201] else 'skipped (no BACKSTAGE_API_URL)' }}
