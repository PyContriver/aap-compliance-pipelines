# Compliance Plugins CI/CD — GitLab CEE
#
# Mirrors the GitHub Actions pipelines:
#   - Collection tests: sanity, units, lint, build (profiles/**)
#   - Deploy: auto-deploy to Netrunner on main push
#
# Backstage CI (yarn build + test) cannot run here — CEE runners
# OOM at ~2GB on yarn install. That runs on GitHub Actions only.
#
# Secrets required (GitLab CI/CD Variables):
#   PORTAL_SSH_KEY  — PEM private key for Portal EC2 host (file type)
#   PORTAL_HOST     — cloud-user@ec2-18-134-232-9.eu-west-2.compute.amazonaws.com

stages:
  - test
  - build
  - deploy

variables:
  REMOTE_PLUGIN_DIR: /var/lib/portal/compliance-plugins
  OVERRIDE_YAML: /etc/portal/configs/dynamic-plugins/dynamic-plugins.override.yaml
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"

# ─── Collection Tests ─────────────────────────────────────────────────

.collection-base:
  tags:
    - itup-alm-x86
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --quiet ansible-core
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - profiles/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

collection-sanity:
  extends: .collection-base
  stage: test
  parallel:
    matrix:
      - PROFILE: rhel9-stig
        COLLECTION: compliance_rhel9_stig
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: rhel9-cis-l1
        COLLECTION: compliance_rhel9_cis_l1
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: rhel9-cis-l2
        COLLECTION: compliance_rhel9_cis_l2
        ANSIBLE_VERSION: ["2.17", "2.18"]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --quiet "ansible-core~=$ANSIBLE_VERSION.0"
  script:
    - COLL_ROOT="profiles/$PROFILE/ansible_collections/security/$COLLECTION"
    - mkdir -p /root/ansible_collections/security
    - ln -s "$CI_PROJECT_DIR/$COLL_ROOT" "/root/ansible_collections/security/$COLLECTION"
    - cd "/root/ansible_collections/security/$COLLECTION"
    - ansible-test sanity --local --color --truncate 0

collection-units:
  extends: .collection-base
  stage: test
  parallel:
    matrix:
      - PROFILE: rhel9-stig
        COLLECTION: compliance_rhel9_stig
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: rhel9-cis-l1
        COLLECTION: compliance_rhel9_cis_l1
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: rhel9-cis-l2
        COLLECTION: compliance_rhel9_cis_l2
        ANSIBLE_VERSION: ["2.17", "2.18"]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --no-cache-dir --quiet "ansible-core~=$ANSIBLE_VERSION.0" pytest
  script:
    - COLL_ROOT="profiles/$PROFILE/ansible_collections/security/$COLLECTION"
    - mkdir -p /root/ansible_collections/security
    - ln -s "$CI_PROJECT_DIR/$COLL_ROOT" "/root/ansible_collections/security/$COLLECTION"
    - cd "/root/ansible_collections/security/$COLLECTION"
    - PYTHONPATH="/root:$PYTHONPATH" python -m pytest tests/unit/ -v --color=yes

collection-lint:
  extends: .collection-base
  stage: test
  allow_failure: true
  parallel:
    matrix:
      - PROFILE: rhel9-stig
        COLLECTION: compliance_rhel9_stig
      - PROFILE: rhel9-cis-l1
        COLLECTION: compliance_rhel9_cis_l1
      - PROFILE: rhel9-cis-l2
        COLLECTION: compliance_rhel9_cis_l2
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --quiet 'ansible-lint>=24.0,<25' 'ansible-core>=2.16,<2.19'
    - |
      COLL_ROOT="profiles/$PROFILE/ansible_collections/security/$COLLECTION"
      cd "$COLL_ROOT"
      python3 -c "
      import yaml
      with open('galaxy.yml') as f:
        deps = yaml.safe_load(f).get('dependencies', {})
      for name, ver in deps.items():
        print(f'{name}:{ver}')
      " > /tmp/deps.txt
      if [ -s /tmp/deps.txt ]; then
        while read dep; do
          ansible-galaxy collection install --pre "$dep" || true
        done < /tmp/deps.txt
      fi
  script:
    - cd "profiles/$PROFILE/ansible_collections/security/$COLLECTION"
    - ansible-lint --offline

collection-build:
  extends: .collection-base
  stage: build
  needs:
    - collection-sanity
    - collection-units
    - job: collection-lint
      optional: true
  parallel:
    matrix:
      - PROFILE: rhel9-stig
        COLLECTION: compliance_rhel9_stig
      - PROFILE: rhel9-cis-l1
        COLLECTION: compliance_rhel9_cis_l1
      - PROFILE: rhel9-cis-l2
        COLLECTION: compliance_rhel9_cis_l2
  script:
    - cd "profiles/$PROFILE/ansible_collections/security/$COLLECTION"
    - ansible-galaxy collection build --force
    - TARBALL=$(ls security-${COLLECTION}-*.tar.gz 2>/dev/null)
    - |
      if [ -z "$TARBALL" ]; then
        echo "ERROR: No collection tarball found after build"
        exit 1
      fi
      echo "Built: $TARBALL ($(du -h "$TARBALL" | cut -f1))"
  artifacts:
    paths:
      - profiles/*/ansible_collections/security/*/security-*.tar.gz
    expire_in: 1 week

# ─── Deploy ───────────────────────────────────────────────────────────

deploy-netrunner:
  stage: deploy
  image: python:3.12-slim
  tags:
    - itup-alm-x86
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client openssl > /dev/null
    - mkdir -p ~/.ssh
    - cp "$PORTAL_SSH_KEY" ~/.ssh/portal.pem
    - chmod 600 ~/.ssh/portal.pem
    - echo "Host *" >> ~/.ssh/config
    - echo "  StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "  LogLevel ERROR" >> ~/.ssh/config
  script:
    - SSH="ssh -i ~/.ssh/portal.pem $PORTAL_HOST"

    # Verify tarballs exist and are valid npm-pack format
    - |
      if [ ! -f deploy-artifacts/backend.tgz ] || [ ! -f deploy-artifacts/frontend.tgz ]; then
        echo "ERROR: deploy-artifacts/backend.tgz or frontend.tgz not found."
        echo "Run ./scripts/deploy-netrunner.sh locally first, then commit deploy-artifacts/."
        exit 1
      fi
      echo "Tarballs found:"
      ls -lh deploy-artifacts/
      for tgz in deploy-artifacts/backend.tgz deploy-artifacts/frontend.tgz; do
        FIRST_ENTRY=$(tar tzf "$tgz" | head -1)
        if [[ "$FIRST_ENTRY" != package/* ]]; then
          echo "ERROR: $tgz is not a valid npm-pack tarball."
          echo "  First entry: '$FIRST_ENTRY' (must start with 'package/')"
          echo "  Use ./scripts/deploy-netrunner.sh to rebuild, or 'npm pack' in dist-dynamic/."
          exit 1
        fi
        SIZE_MB=$(du -m "$tgz" | cut -f1)
        if [ "$SIZE_MB" -gt 50 ]; then
          echo "ERROR: $tgz is ${SIZE_MB}MB — too large (>50MB). Check for accumulated old tarballs."
          exit 1
        fi
      done
      echo "Tarball format validated (npm-pack, <50MB each)"

    # Upload tarballs from repo to Portal host
    - scp -i ~/.ssh/portal.pem deploy-artifacts/backend.tgz "$PORTAL_HOST:/tmp/backend.tgz"
    - scp -i ~/.ssh/portal.pem deploy-artifacts/frontend.tgz "$PORTAL_HOST:/tmp/frontend.tgz"
    - |
      $SSH "
        sudo cp /tmp/backend.tgz $REMOTE_PLUGIN_DIR/backend.tgz
        sudo cp /tmp/frontend.tgz $REMOTE_PLUGIN_DIR/frontend.tgz
        # Remove extracted plugin dirs AND the lock file so Portal re-extracts cleanly.
        # Without removing the lock, Portal's cleanup sweep treats the just-installed
        # same-version dir as a stale entry and deletes it (causing 404 on all API routes).
        sudo rm -rf /opt/app-root/src/dynamic-plugins-root/aap-compliance-*
        sudo rm -f /opt/app-root/src/dynamic-plugins-root/install-dynamic-plugins.lock
      "
    - echo "Tarballs uploaded, old extractions and lock file cleared"

    # Update Portal config with integrity hashes
    - |
      $SSH "sudo python3 << 'PYEOF'
      import yaml, subprocess, base64

      with open('$OVERRIDE_YAML') as f:
          data = yaml.safe_load(f)

      for plugin in data['plugins']:
          pkg = plugin.get('package', '')
          if 'compliance-backend' in pkg:
              new_pkg = '$REMOTE_PLUGIN_DIR/backend.tgz'
              h = subprocess.check_output(['openssl', 'dgst', '-sha512', '-binary', new_pkg])
              plugin['package'] = new_pkg
              plugin['integrity'] = 'sha512-' + base64.b64encode(h).decode()
              print(f'Updated backend: {new_pkg}')
          elif 'compliance' in pkg and 'backend' not in pkg:
              new_pkg = '$REMOTE_PLUGIN_DIR/frontend.tgz'
              h = subprocess.check_output(['openssl', 'dgst', '-sha512', '-binary', new_pkg])
              plugin['package'] = new_pkg
              plugin['integrity'] = 'sha512-' + base64.b64encode(h).decode()
              print(f'Updated frontend: {new_pkg}')

      with open('$OVERRIDE_YAML', 'w') as f:
          yaml.dump(data, f, default_flow_style=False, sort_keys=False, width=200)
      PYEOF"

    # Restart Portal
    - $SSH "sudo systemctl restart portal.service"
    - echo "Portal restarting, waiting 120s..."
    - sleep 120

    # Verify
    - |
      STATUS=$($SSH "sudo systemctl is-active portal.service")
      if [ "$STATUS" = "active" ]; then
        echo "Portal is active"
        $SSH "sudo podman logs portal 2>&1 | grep -E 'compliance.*info|loaded.*compliance' | tail -5"
        echo "Deploy successful"
      else
        echo "WARNING: Portal status is $STATUS"
        $SSH "sudo podman logs portal 2>&1 | tail -20"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
  environment:
    name: netrunner-staging
    url: https://dev-portal-netrunner.demoredhat.com/compliance
