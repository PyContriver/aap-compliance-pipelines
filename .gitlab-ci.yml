# Compliance Plugins CI/CD — GitLab CEE (sole CI platform)
#
# Full pipeline:
#   - Backstage: test → export dynamic plugins → deploy to Netrunner
#   - Collections: sanity, units, lint, build (profiles/**)
#
# GitHub remains a collaboration mirror — no CI runs there.
#
# Secrets required (GitLab CI/CD Variables):
#   PORTAL_SSH_KEY  — PEM private key for Portal EC2 host (file type)
#   PORTAL_HOST     — cloud-user@ec2-18-134-232-9.eu-west-2.compute.amazonaws.com

workflow:
  rules:
    - when: always

stages:
  - test
  - build
  - deploy

variables:
  REMOTE_PLUGIN_DIR: /var/lib/portal/compliance-plugins
  OVERRIDE_YAML: /etc/portal/configs/dynamic-plugins/dynamic-plugins.override.yaml
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  NODE_OPTIONS: "--max_old_space_size=3072"

# ─── Backstage Test ──────────────────────────────────────────────────

backstage-test:
  stage: test
  tags:
    - itup-alm-x86
  image: node:20-slim
  before_script:
    - corepack enable
    - corepack prepare yarn@4.12.0 --activate
  script:
    - cd backstage-app
    - yarn install --immutable || yarn install
    - yarn tsc --build
    - yarn build
    - yarn test --watchAll=false --ci
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - backstage-app/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - backstage-app/**/*
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

# ─── Backstage Export Dynamic Plugins ────────────────────────────────

backstage-export:
  stage: build
  tags:
    - itup-alm-x86
  image: node:20-slim
  needs:
    - backstage-test
  before_script:
    - corepack enable
    - corepack prepare yarn@4.12.0 --activate
    - apt-get update -qq && apt-get install -y -qq openssl > /dev/null
  script:
    - cd backstage-app
    - yarn install --immutable || yarn install
    - yarn tsc --build
    - yarn build

    # Bump patch versions
    - cd plugins/compliance-backend && npm version patch --no-git-tag-version && cd ../..
    - cd plugins/compliance && npm version patch --no-git-tag-version && cd ../..
    - echo "Backend $(node -p "require('./plugins/compliance-backend/package.json').version")"
    - echo "Frontend $(node -p "require('./plugins/compliance/package.json').version")"

    # Export dynamic plugins
    - cd plugins/compliance-backend
    - npx --yes @red-hat-developer-hub/cli plugin export --embed-package @aap-compliance/common
    - cd dist-dynamic && npm pack && cd ../../..
    - cd plugins/compliance
    - npx --yes @red-hat-developer-hub/cli plugin export
    - cd dist-dynamic && npm pack && cd ../../..

    # Stage tarballs
    - mkdir -p $CI_PROJECT_DIR/tarballs
    - find plugins/compliance-backend/dist-dynamic -name '*.tgz' -exec cp {} $CI_PROJECT_DIR/tarballs/backend.tgz \;
    - find plugins/compliance/dist-dynamic -name '*.tgz' -exec cp {} $CI_PROJECT_DIR/tarballs/frontend.tgz \;

    # Validate npm-pack format
    - |
      for tgz in $CI_PROJECT_DIR/tarballs/backend.tgz $CI_PROJECT_DIR/tarballs/frontend.tgz; do
        FIRST=$(tar tzf "$tgz" | head -1)
        case "$FIRST" in
          package/*) ;;
          *) echo "ERROR: $tgz not npm-pack format (first entry: '$FIRST')"; exit 1 ;;
        esac
      done
      echo "Tarball format validated"
      ls -lh $CI_PROJECT_DIR/tarballs/

    # Compute integrity hashes for logging
    - |
      for tgz in $CI_PROJECT_DIR/tarballs/*.tgz; do
        hash=$(openssl dgst -sha512 -binary < "$tgz" | base64)
        echo "$(basename $tgz): sha512-${hash:0:32}..."
      done
  artifacts:
    paths:
      - tarballs/backend.tgz
      - tarballs/frontend.tgz
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - backstage-app/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

# ─── Collection Tests ─────────────────────────────────────────────────

.collection-base:
  tags:
    - itup-alm-x86
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --quiet ansible-core
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - profiles/**/*
        - .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

collection-sanity:
  extends: .collection-base
  stage: test
  parallel:
    matrix:
      - PROFILE: rhel9-stig
        COLLECTION: compliance_rhel9_stig
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: rhel9-cis-l1
        COLLECTION: compliance_rhel9_cis_l1
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: rhel9-cis-l2
        COLLECTION: compliance_rhel9_cis_l2
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: supply-chain
        COLLECTION: compliance_supply_chain
        ANSIBLE_VERSION: ["2.17", "2.18"]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --quiet "ansible-core~=$ANSIBLE_VERSION.0"
  script:
    - COLL_ROOT="profiles/$PROFILE/ansible_collections/security/$COLLECTION"
    - mkdir -p /root/ansible_collections/security
    - ln -s "$CI_PROJECT_DIR/$COLL_ROOT" "/root/ansible_collections/security/$COLLECTION"
    - cd "/root/ansible_collections/security/$COLLECTION"
    - ansible-test sanity --local --color --truncate 0

collection-units:
  extends: .collection-base
  stage: test
  parallel:
    matrix:
      - PROFILE: rhel9-stig
        COLLECTION: compliance_rhel9_stig
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: rhel9-cis-l1
        COLLECTION: compliance_rhel9_cis_l1
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: rhel9-cis-l2
        COLLECTION: compliance_rhel9_cis_l2
        ANSIBLE_VERSION: ["2.17", "2.18"]
      - PROFILE: supply-chain
        COLLECTION: compliance_supply_chain
        ANSIBLE_VERSION: ["2.17", "2.18"]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --no-cache-dir --quiet "ansible-core~=$ANSIBLE_VERSION.0" pytest
  script:
    - COLL_ROOT="profiles/$PROFILE/ansible_collections/security/$COLLECTION"
    - mkdir -p /root/ansible_collections/security
    - ln -s "$CI_PROJECT_DIR/$COLL_ROOT" "/root/ansible_collections/security/$COLLECTION"
    - cd "/root/ansible_collections/security/$COLLECTION"
    - PYTHONPATH="/root:$PYTHONPATH" python -m pytest tests/unit/ -v --color=yes

collection-lint:
  extends: .collection-base
  stage: test
  allow_failure: true
  parallel:
    matrix:
      - PROFILE: rhel9-stig
        COLLECTION: compliance_rhel9_stig
      - PROFILE: rhel9-cis-l1
        COLLECTION: compliance_rhel9_cis_l1
      - PROFILE: rhel9-cis-l2
        COLLECTION: compliance_rhel9_cis_l2
      - PROFILE: supply-chain
        COLLECTION: compliance_supply_chain
  before_script:
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
    - pip install --quiet 'ansible-lint>=24.0,<25' 'ansible-core>=2.16,<2.19'
    - |
      COLL_ROOT="profiles/$PROFILE/ansible_collections/security/$COLLECTION"
      cd "$COLL_ROOT"
      python3 -c "
      import yaml
      with open('galaxy.yml') as f:
        deps = yaml.safe_load(f).get('dependencies', {})
      for name, ver in deps.items():
        print(f'{name}:{ver}')
      " > /tmp/deps.txt
      if [ -s /tmp/deps.txt ]; then
        while read dep; do
          ansible-galaxy collection install --pre "$dep" || true
        done < /tmp/deps.txt
      fi
  script:
    - cd "profiles/$PROFILE/ansible_collections/security/$COLLECTION"
    - ansible-lint --offline

collection-build:
  extends: .collection-base
  stage: build
  needs:
    - collection-sanity
    - collection-units
    - job: collection-lint
      optional: true
  parallel:
    matrix:
      - PROFILE: rhel9-stig
        COLLECTION: compliance_rhel9_stig
      - PROFILE: rhel9-cis-l1
        COLLECTION: compliance_rhel9_cis_l1
      - PROFILE: rhel9-cis-l2
        COLLECTION: compliance_rhel9_cis_l2
      - PROFILE: supply-chain
        COLLECTION: compliance_supply_chain
  script:
    - cd "profiles/$PROFILE/ansible_collections/security/$COLLECTION"
    - ansible-galaxy collection build --force
    - TARBALL=$(ls security-${COLLECTION}-*.tar.gz 2>/dev/null)
    - |
      if [ -z "$TARBALL" ]; then
        echo "ERROR: No collection tarball found after build"
        exit 1
      fi
      echo "Built: $TARBALL ($(du -h "$TARBALL" | cut -f1))"
  artifacts:
    paths:
      - profiles/*/ansible_collections/security/*/security-*.tar.gz
    expire_in: 1 week

# ─── EE Build (triggered via GitHub Actions) ─────────────────────────
#
# EE images are built by GitHub Actions (.github/workflows/build-ee.yml)
# because GitLab CEE runners lack container build tooling (no docker/podman).
# GitHub builds on push to profiles/** and via workflow_dispatch.
#
# To trigger manually: gh workflow run build-ee.yml
# Images: ghcr.io/cross-logic/compliance-{stig,cis-l1,cis-l2}-rhel9:latest

# ─── Deploy ───────────────────────────────────────────────────────────

deploy-netrunner:
  stage: deploy
  needs:
    - job: backstage-export
      artifacts: true
  image: python:3.12-slim
  tags:
    - itup-alm-x86
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client openssl > /dev/null
    - mkdir -p ~/.ssh
    - cp "$PORTAL_SSH_KEY" ~/.ssh/portal.pem
    - chmod 600 ~/.ssh/portal.pem
    - echo "Host *" >> ~/.ssh/config
    - echo "  StrictHostKeyChecking no" >> ~/.ssh/config
    - echo "  LogLevel ERROR" >> ~/.ssh/config
  script:
    - SSH="ssh -i ~/.ssh/portal.pem $PORTAL_HOST"

    # Verify tarballs from export stage
    - |
      if [ ! -f tarballs/backend.tgz ] || [ ! -f tarballs/frontend.tgz ]; then
        echo "ERROR: tarballs/backend.tgz or frontend.tgz not found in artifacts."
        exit 1
      fi
      echo "Tarballs from export stage:"
      ls -lh tarballs/
      for tgz in tarballs/backend.tgz tarballs/frontend.tgz; do
        FIRST_ENTRY=$(tar tzf "$tgz" 2>/dev/null | head -1 || true)
        case "$FIRST_ENTRY" in
          package/*) ;;
          *)
            echo "ERROR: $tgz is not a valid npm-pack tarball."
            echo "  First entry: '$FIRST_ENTRY' (must start with 'package/')"
            exit 1
            ;;
        esac
      done
      echo "Tarball format validated"

    # Backup current override YAML
    - |
      $SSH "
        sudo cp $OVERRIDE_YAML ${OVERRIDE_YAML}.bak
        echo 'Backed up override YAML'
      "

    # Upload tarballs
    - scp -i ~/.ssh/portal.pem tarballs/backend.tgz "$PORTAL_HOST:/tmp/backend.tgz"
    - scp -i ~/.ssh/portal.pem tarballs/frontend.tgz "$PORTAL_HOST:/tmp/frontend.tgz"
    - |
      $SSH "
        sudo cp /tmp/backend.tgz $REMOTE_PLUGIN_DIR/backend.tgz
        sudo cp /tmp/frontend.tgz $REMOTE_PLUGIN_DIR/frontend.tgz
        sudo rm -rf /opt/app-root/src/dynamic-plugins-root/aap-compliance-*
        sudo rm -f /opt/app-root/src/dynamic-plugins-root/install-dynamic-plugins.lock
      "
    - echo "Tarballs uploaded, old extractions and lock file cleared"

    # Update integrity hashes
    - |
      BACKEND_HASH=$($SSH "openssl dgst -sha512 -binary $REMOTE_PLUGIN_DIR/backend.tgz | base64 -w0")
      FRONTEND_HASH=$($SSH "openssl dgst -sha512 -binary $REMOTE_PLUGIN_DIR/frontend.tgz | base64 -w0")
      echo "Backend hash: sha512-${BACKEND_HASH:0:20}..."
      echo "Frontend hash: sha512-${FRONTEND_HASH:0:20}..."
      $SSH "
        sudo sed -i '/backend\.tgz/,/integrity:/ s|integrity:.*|integrity: sha512-$BACKEND_HASH|' $OVERRIDE_YAML
        sudo sed -i '/frontend\.tgz/,/integrity:/ s|integrity:.*|integrity: sha512-$FRONTEND_HASH|' $OVERRIDE_YAML
      "
      $SSH "grep -A2 'backend\.tgz' $OVERRIDE_YAML | grep integrity"
      $SSH "grep -A2 'frontend\.tgz' $OVERRIDE_YAML | grep integrity"
      echo "Integrity hashes updated and verified"

    # Ensure frontend route
    - |
      $SSH "
        if grep -q 'path: /compliance\$' $OVERRIDE_YAML && ! grep -q 'path: /compliance/\*' $OVERRIDE_YAML; then
          sudo sed -i '/path: \/compliance$/a\\      - importName: CompliancePage\n        path: /compliance/*' $OVERRIDE_YAML
          echo 'Added /compliance/* catch-all route'
        else
          echo 'Routes already configured'
        fi
      "

    # Restart Portal
    - $SSH "sudo systemctl restart portal.service"
    - echo "Portal restarting, waiting 120s..."
    - sleep 120

    # Verify
    - |
      STATUS=$($SSH "sudo systemctl is-active portal.service")
      if [ "$STATUS" = "active" ]; then
        echo "Portal is active"
        $SSH "sudo podman logs portal 2>&1 | grep -E 'compliance.*info|loaded.*compliance' | tail -5"
        echo "Deploy successful"
      else
        echo "WARNING: Portal status is $STATUS"
        $SSH "sudo podman logs portal 2>&1 | tail -20"
        exit 1
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - backstage-app/**/*
        - .gitlab-ci.yml
      when: on_success
    - if: $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api"
      when: on_success
  environment:
    name: netrunner-staging
    url: https://dev-portal-netrunner.demoredhat.com/compliance
