name: Build Compliance EEs

on:
  push:
    branches: [main]
    paths:
      - 'profiles/rhel9-stig/ansible_collections/**'
      - 'profiles/rhel9-cis-l1/ansible_collections/**'
      - 'profiles/rhel9-cis-l2/ansible_collections/**'
      - 'profiles/supply-chain/ansible_collections/**'
      - 'profiles/_shared/**'
      - '.github/workflows/build-ee.yml'
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Profiles to build (comma-separated, or "all")'
        required: false
        default: 'all'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: rhel9-stig
            collection: compliance_rhel9_stig
            image_suffix: stig-rhel9
            ee_verify_file: /usr/share/scap-security-guide/ansible/rhel9-playbook-stig.yml
            scanner_type: xccdf
          - profile: rhel9-cis-l1
            collection: compliance_rhel9_cis_l1
            image_suffix: cis-l1-rhel9
            ee_verify_file: /usr/share/scap-security-guide/ansible/rhel9-playbook-cis_server_l1.yml
            scanner_type: xccdf
          - profile: rhel9-cis-l2
            collection: compliance_rhel9_cis_l2
            image_suffix: cis-l2-rhel9
            ee_verify_file: /usr/share/scap-security-guide/ansible/rhel9-playbook-cis.yml
            scanner_type: xccdf
          - profile: supply-chain
            collection: compliance_supply_chain
            image_suffix: supply-chain
            ee_verify_file: /usr/local/bin/syft
            scanner_type: cyclonedx

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/compliance-${{ matrix.image_suffix }}
      COLLECTION_DIR: profiles/${{ matrix.profile }}/ansible_collections/security/${{ matrix.collection }}
      EE_DIR: profiles/${{ matrix.profile }}/ee

    steps:
      - name: Check if profile should build
        id: check
        run: |
          INPUT="${{ github.event.inputs.profiles || 'all' }}"
          if [[ "$INPUT" == "all" ]] || echo "$INPUT" | grep -q "${{ matrix.profile }}"; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Set up Python
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ansible-builder
        if: steps.check.outputs.skip != 'true'
        run: pip install ansible-builder

      - name: Log in to GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to registry.redhat.io
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_REGISTRY_USER }}
          password: ${{ secrets.REDHAT_REGISTRY_TOKEN }}

      - name: Prepare build context
        if: steps.check.outputs.skip != 'true'
        run: |
          BUILD_DIR=$(mktemp -d)
          echo "BUILD_DIR=$BUILD_DIR" >> $GITHUB_ENV

          # Copy EE definition
          cp $EE_DIR/execution-environment.yml $BUILD_DIR/execution-environment.yml

          # Create ansible-builder context
          cd $BUILD_DIR
          ansible-builder create -f execution-environment.yml -v 3

          # Copy collection into the build context
          mkdir -p context/_build/collections/ansible_collections/security
          cp -r $GITHUB_WORKSPACE/$COLLECTION_DIR \
            context/_build/collections/ansible_collections/security/${{ matrix.collection }}

          # Copy extract_rule_metadata.py for XCCDF profiles (not needed for CycloneDX)
          if [ "${{ matrix.scanner_type }}" = "xccdf" ]; then
            cp $GITHUB_WORKSPACE/scripts/extract_rule_metadata.py context/_build/extract_rule_metadata.py
          fi

      - name: Build EE image
        if: steps.check.outputs.skip != 'true'
        run: |
          cd $BUILD_DIR
          docker build -f context/Containerfile -t $IMAGE_NAME:latest context

      - name: Tag with SHA
        if: steps.check.outputs.skip != 'true'
        run: docker tag $IMAGE_NAME:latest $IMAGE_NAME:${{ github.sha }}

      - name: Push to GHCR
        if: steps.check.outputs.skip != 'true'
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

      - name: Make package public
        if: steps.check.outputs.skip != 'true'
        run: |
          PACKAGE_NAME="compliance-${{ matrix.image_suffix }}"
          gh api --method PUT \
            "/user/packages/container/${PACKAGE_NAME}/versions" \
            -f visibility=public 2>/dev/null || \
          echo "Could not set visibility (may need admin:packages scope) — Controller uses GHCR credential as fallback"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify EE contents (XCCDF)
        if: steps.check.outputs.skip != 'true' && matrix.scanner_type == 'xccdf'
        run: |
          docker run --rm $IMAGE_NAME:latest \
            rpm -q scap-security-guide openscap-scanner
          docker run --rm $IMAGE_NAME:latest \
            test -f ${{ matrix.ee_verify_file }}
          docker run --rm $IMAGE_NAME:latest \
            test -f /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml
          docker run --rm $IMAGE_NAME:latest \
            ansible-galaxy collection list security.${{ matrix.collection }}
          echo "EE verified: $IMAGE_NAME (XCCDF)"

      - name: Verify EE contents (CycloneDX)
        if: steps.check.outputs.skip != 'true' && matrix.scanner_type == 'cyclonedx'
        run: |
          docker run --rm $IMAGE_NAME:latest syft version
          docker run --rm $IMAGE_NAME:latest grype version
          docker run --rm $IMAGE_NAME:latest jq --version
          docker run --rm $IMAGE_NAME:latest \
            test -f ${{ matrix.ee_verify_file }}
          docker run --rm $IMAGE_NAME:latest \
            ansible-galaxy collection list security.${{ matrix.collection }}
          echo "EE verified: $IMAGE_NAME (CycloneDX)"
