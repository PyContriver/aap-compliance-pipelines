# CI has moved to GitLab CEE (.gitlab-ci.yml)
#
# GitHub handles ONLY EE image builds (build-ee.yml) — these need
# container tooling (docker) which GitLab CEE runners lack.
#
# GitLab handles everything else:
#   - backstage-test: yarn install/build/test
#   - backstage-export: janus-cli dynamic plugin export
#   - deploy-netrunner: SCP to Portal + restart
#   - collection-*: Ansible collection sanity/unit/lint/build
#
# This workflow is intentionally disabled.

name: CI (disabled — see GitLab)

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI has moved to GitLab CEE. See .gitlab-ci.yml for the full pipeline."
