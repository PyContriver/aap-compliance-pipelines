name: CI

on:
  push:
    branches: [main]
    paths:
      - 'backstage-app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backstage-app/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: backstage-app

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack and Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install

      - name: Generate type declarations
        run: yarn tsc --build

      - name: Build all packages
        run: yarn build

      - name: Run tests
        run: yarn test --watchAll=false --ci

  export-dynamic:
    name: Export Dynamic Plugins
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack and Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install

      - name: Generate type declarations
        run: yarn tsc --build

      - name: Build all packages
        run: yarn build

      - name: Export backend plugin
        run: npx --yes @red-hat-developer-hub/cli plugin export --embed-package @aap-compliance/common
        working-directory: backstage-app/plugins/compliance-backend

      - name: Export frontend plugin
        run: npx --yes @red-hat-developer-hub/cli plugin export
        working-directory: backstage-app/plugins/compliance

      - name: Pack tarballs
        run: |
          cd plugins/compliance-backend/dist-dynamic && npm pack
          cd ../../compliance/dist-dynamic && npm pack

      - name: Compute integrity hashes
        run: |
          echo "## Plugin Tarballs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for tgz in plugins/*/dist-dynamic/*.tgz; do
            hash=$(openssl dgst -sha512 -binary < "$tgz" | base64)
            name=$(basename "$tgz")
            echo "**$name**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "sha512-$hash" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload backend tarball
        uses: actions/upload-artifact@v4
        with:
          name: compliance-backend-dynamic
          path: backstage-app/plugins/compliance-backend/dist-dynamic/*.tgz

      - name: Upload frontend tarball
        uses: actions/upload-artifact@v4
        with:
          name: compliance-frontend-dynamic
          path: backstage-app/plugins/compliance/dist-dynamic/*.tgz

  stage-tarballs:
    name: Stage Tarballs for Deploy
    needs: export-dynamic
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download backend tarball
        uses: actions/download-artifact@v4
        with:
          name: compliance-backend-dynamic
          path: artifacts/backend

      - name: Download frontend tarball
        uses: actions/download-artifact@v4
        with:
          name: compliance-frontend-dynamic
          path: artifacts/frontend

      - name: Stage tarballs to deploy-artifacts/
        working-directory: .
        run: |
          ls -R artifacts/
          find artifacts/ -name '*.tgz' -path '*/backend/*' -exec cp {} deploy-artifacts/backend.tgz \;
          find artifacts/ -name '*.tgz' -path '*/frontend/*' -exec cp {} deploy-artifacts/frontend.tgz \;
          ls -lh deploy-artifacts/

          # Validate npm-pack format
          for tgz in deploy-artifacts/backend.tgz deploy-artifacts/frontend.tgz; do
            FIRST_ENTRY=$(tar tzf "$tgz" | head -1)
            if [[ "$FIRST_ENTRY" != package/* ]]; then
              echo "ERROR: $tgz is not npm-pack format (first entry: '$FIRST_ENTRY')"
              exit 1
            fi
          done
          echo "Tarball format validated"

      - name: Commit and push tarballs
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f deploy-artifacts/backend.tgz deploy-artifacts/frontend.tgz
          if git diff --cached --quiet; then
            echo "No tarball changes to commit"
          else
            git commit -m "deploy: update tarballs from CI build [skip ci]"
            git push origin main
          fi
