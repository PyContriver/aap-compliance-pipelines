---
# AAP Controller Job Templates for RHEL 9 STIG Compliance
#
# Architecture: 2-node assessment workflow (run-oscap → normalize)
# with a standalone remediation JT launched directly.
#
# All JTs must have ask_inventory_on_launch: true so the workflow's
# inventory override propagates. Remediation JT also needs
# ask_tags_on_launch for scoped rule selection via CaC job_tags.
#
# Assessment workflow:
#   Node 1: compliance-run-oscap — oscap xccdf eval on targets (read-only)
#   Node 2: compliance-normalize — XCCDF XML → CFF JSON on execution node
#
# Remediation: launched directly (not via workflow) with job_tags
# for human-supervised, EDA-automated, or autonomous modes.
controller_templates:
  - name: compliance-run-oscap
    organization: compliance-prototype
    description: "Run OpenSCAP STIG scan on RHEL 9 targets (install, scan, fetch, cleanup)"
    job_type: run
    inventory: compliance-rhel9-inventory
    project: compliance-content
    playbook: collections/ansible_collections/security/compliance_rhel9_stig/playbooks/run_oscap.yml
    credentials:
      - compliance-lab-ssh
    become_enabled: true
    ask_inventory_on_launch: true
    ask_limit_on_launch: true

  - name: compliance-normalize
    organization: compliance-prototype
    description: "Normalize XCCDF results to Common Findings Format on execution node"
    job_type: run
    inventory: compliance-rhel9-inventory
    project: compliance-content
    playbook: collections/ansible_collections/security/compliance_rhel9_stig/playbooks/normalize.yml
    ask_inventory_on_launch: true

  - name: compliance-remediate
    organization: compliance-prototype
    description: "Apply CaC STIG remediation to selected rules on RHEL 9 hosts"
    job_type: run
    inventory: compliance-rhel9-inventory
    project: compliance-content
    playbook: collections/ansible_collections/security/compliance_rhel9_stig/playbooks/remediate.yml
    credentials:
      - compliance-lab-ssh
    become_enabled: true
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_tags_on_launch: true
    ask_variables_on_launch: true
...
