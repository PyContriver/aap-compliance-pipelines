---
# AAP Controller Job Templates for RHEL 9 STIG Compliance
#
# Architecture: single assessment JT (run_oscap.yml with 2 plays)
# plus a standalone remediation JT launched directly.
#
# The assessment JT (compliance-run-oscap) runs scan + normalize in
# one container. No workflow needed -- Play 1 scans targets, Play 2
# normalizes on localhost.
#
# The normalize JT is retained as a standalone utility for debugging
# and Tier 2 scanner reuse.
#
# Remediation: launched directly (not via assessment) with job_tags
# for human-supervised, EDA-automated, or autonomous modes.
controller_templates:
  - name: compliance-run-oscap
    organization: compliance-prototype
    description: "OpenSCAP STIG assessment: scan targets + normalize results (single JT, 2 plays)"
    job_type: run
    inventory: compliance-rhel9-inventory
    project: compliance-content
    execution_environment: "Compliance STIG RHEL 9"
    playbook: collections/ansible_collections/security/compliance_rhel9_stig/playbooks/run_oscap.yml
    credentials:
      - compliance-lab-ssh
    become_enabled: true
    ask_inventory_on_launch: true
    ask_limit_on_launch: true

  - name: compliance-normalize
    organization: compliance-prototype
    description: "Standalone normalize utility (debugging, Tier 2 reuse) — not needed for standard assessment"
    job_type: run
    inventory: compliance-rhel9-inventory
    project: compliance-content
    execution_environment: "Compliance STIG RHEL 9"
    playbook: collections/ansible_collections/security/compliance_rhel9_stig/playbooks/normalize.yml
    ask_inventory_on_launch: true

  - name: compliance-remediate
    organization: compliance-prototype
    description: "Apply CaC STIG remediation to selected rules on RHEL 9 hosts"
    job_type: run
    inventory: compliance-rhel9-inventory
    project: compliance-content
    execution_environment: "Compliance STIG RHEL 9"
    playbook: collections/ansible_collections/security/compliance_rhel9_stig/playbooks/remediate.yml
    credentials:
      - compliance-lab-ssh
    become_enabled: true
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_tags_on_launch: true
    ask_variables_on_launch: true
...
