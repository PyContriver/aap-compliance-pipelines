---
# IMPORTANT: All job templates must have ask_inventory_on_launch: true
# so the workflow's inventory override propagates to each node.
#
# The assessment workflow is 2 nodes: gather -> evaluate (read-only).
# Remediation is NOT a workflow node — it is launched as a separate
# direct JT with job_tags for scoped rule selection. This ensures
# assessments never modify hosts and enables human review, EDA policy
# evaluation, or AI-driven decision-making between assess and remediate.
#
# The remediation JT needs ask_tags_on_launch: true because the plugin
# launches it directly (not via workflow) with job_tags.
controller_templates:
  - name: compliance-scan-rhel9-stig
    organization: compliance-prototype
    description: "Scan RHEL 9 hosts against DISA STIG V2R8 using OpenSCAP"
    job_type: check
    inventory: compliance-rhel9-inventory
    project: compliance-content
    playbook: playbooks/scan-rhel9-stig.yml
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    survey_enabled: true
    survey_spec: "{{ lookup('file', 'template_surveys/scan-survey.yml') | from_yaml }}"

  - name: compliance-remediate-rhel9-stig
    organization: compliance-prototype
    description: "Remediate selected STIG findings on RHEL 9 hosts"
    job_type: run
    inventory: compliance-rhel9-inventory
    project: compliance-content
    playbook: playbooks/remediate-rhel9-stig.yml
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_tags_on_launch: true
    ask_variables_on_launch: true
    survey_enabled: false

  - name: compliance-verify-rhel9-stig
    organization: compliance-prototype
    description: "Verification re-scan after remediation"
    job_type: check
    inventory: compliance-rhel9-inventory
    project: compliance-content
    playbook: playbooks/scan-rhel9-stig.yml
    ask_inventory_on_launch: true
